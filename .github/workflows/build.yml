name: Build & Release Ragdoll Physics Mod
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'
      - name: Build Forge Mod
        run: |
          gradle wrapper --gradle-version 8.8
          chmod +x ./gradlew
          ./gradlew build --no-daemon
      - name: Create Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR_FILE=$(ls build/libs/ragdoll_physics-*.jar | head -n 1)
          gh release create v1.0.0 "$JAR_FILE" --title "Ragdoll Physics Mod v1.0.0 (Forge 1.20.1)" --notes "Ragdoll Physics Mod v1.0.0 for Minecraft 1.20.1 (Forge 47.2.0+)."
